<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AVIS's dynamic portfolio focused on art technology, UI/UX, cultural business, and project management."
    />
    <title>AVIS | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="intro-screen" id="introScreen" aria-label="3D portfolio introduction">
      <iframe
        id="introCanvas"
        class="intro-iframe"
        src="https://coconut-yeezy.github.io/3dweb/"
        title="Three.js Conf interactive introduction"
        loading="eager"
        allow="fullscreen"
      ></iframe>
      <canvas id="introCanvasFallback" class="intro-fallback-canvas" aria-hidden="true"></canvas>
      <div class="intro-scanlines" aria-hidden="true"></div>

      <div class="intro-topline">
        <a class="intro-logo" href="#introScreen" aria-label="Back to intro">C</a>
        <span>HONG RUIER / 2026—2027</span>
        <button class="intro-share" id="introShare" type="button">Share</button>
      </div>

      <div class="intro-copy">
        <p class="intro-kicker">Meet the work</p>
        <h1>Hello!<br /><em>I’m AVIS</em></h1>
        <p>Enter a name and let 3D character particles build an exploratory art-tech entrance.</p>
      </div>

      <div class="intro-tools" id="introTools">
        <label class="intro-name-field">
          <span>Name to build</span>
          <input id="introName" type="text" value="AVIS" maxlength="16" autocomplete="off" />
        </label>
        <button class="intro-tool-button" id="introSparkle" type="button">Sparkle</button>
        <button class="intro-tool-button" id="introSettings" type="button" aria-expanded="false">Settings</button>
        <div class="intro-settings" id="introSettingsPanel" hidden>
          <label>Letters and lattice <input id="introLetterColor" type="color" value="#000000" /></label>
          <label>Background <input id="introBgColor" type="color" value="#9795ed" /></label>
          <label>Deep field <input id="introDeepColor" type="color" value="#644da7" /></label>
        </div>
      </div>

      <button class="intro-enter" id="introEnter" type="button">Enter portfolio <span>↗</span></button>
      <div class="intro-status" id="introStatus">DRAG TO ROTATE · CLICK TO SPARK</div>
    </section>

    <div class="page-shell" id="portfolioShell" hidden>
      <header class="topbar">
        <div class="brand-group">
          <div class="brand-mark">C</div>
          <div>
            <p class="brand-name">AVIS</p>
            <p class="brand-subtitle">Art Tech & Business</p>
          </div>
        </div>

        <nav class="main-nav" aria-label="Main navigation"></nav>

        <div class="topbar-actions">
          <button class="secondary-btn intro-return" id="introReturn" type="button">Back to intro</button>
          <a class="primary-btn" href="#contact">Contact</a>
        </div>
      </header>

      <main id="app"></main>

      <footer class="site-footer">
        <div class="footer-inner">
          <p>© 2026 | MSc in Arts Technology and Business | Personal Portfolio</p>
          <div class="footer-links">
            <a href="#hero">Home</a>
            <a href="#projects">Work</a>
            <a href="#contact">Contact</a>
          </div>
        </div>
      </footer>
    </div>

    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="data/content.js"></script>
    <script src="app.js"></script>
  </body>
</html>
